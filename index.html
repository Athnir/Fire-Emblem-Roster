<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- "-v2" suffix: see vite.config.ts's manifest.icons comment — a same-named icon fix can get
         stuck behind Chrome's own server-side WebAPK-minting cache indefinitely; a new filename is
         the only way to guarantee a real cache miss there instead of maybe getting lucky. -->
    <link rel="icon" type="image/png" href="/icons/icon-192-v2.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-v2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fire Emblem Roster</title>
    <style>
      /* Inline critical CSS: applies instantly, independent of the external stylesheet's load
         timing — otherwise a slow network/service-worker cache lookup can let React render
         before the stylesheet arrives, flashing a stark white background. Deliberately minimal
         (just background/text color, no element resets) since Tailwind v4 wraps its own rules in
         @layer, and unlayered rules always beat layered ones regardless of specificity — a
         broader reset here would permanently override Tailwind's own button/etc. styling. */
      html, body { background-color: #0a0a0a; color: #e5e5e5; }
    </style>
    <script>
      // Self-heal a failed/aborted stylesheet fetch (seen as net::ERR_ABORTED, most likely from
      // an overlapping navigation or a stale service-worker cache entry racing the real request).
      // A render-blocking <link> that errors just gets skipped by the browser — it paints
      // unstyled rather than waiting — so without this the page is stuck that way until a manual
      // reload. One bounded retry (guarded via sessionStorage) avoids looping if the stylesheet
      // is genuinely missing.
      window.addEventListener('load', function () {
        var failed = Array.prototype.some.call(
          document.querySelectorAll('link[rel="stylesheet"]'),
          function (link) { return link.href && !link.sheet; }
        );
        if (failed && !sessionStorage.getItem('css-retry')) {
          sessionStorage.setItem('css-retry', '1');
          location.reload();
        } else if (!failed) {
          sessionStorage.removeItem('css-retry');
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
